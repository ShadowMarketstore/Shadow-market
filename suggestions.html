<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Suggestions - Shadow Market</title>
    <style>
        body { 
            font-family: 'Segoe UI', sans-serif; background: #000; color: #fff; margin: 0; 
            padding: 20px; box-sizing: border-box; padding-bottom: 60px; 
        }

        #suggestion-container { 
            width: 100%; max-width: 500px; margin: 0 auto 25px auto; background: #0a0a0a; padding: 25px; 
            border: 2px solid #00ffff; border-radius: 15px; box-shadow: 0 0 15px #00ffff; 
            display: flex; flex-direction: column; gap: 15px;
        }
        h2 { text-align: center; color: #00ffff; text-transform: uppercase; text-shadow: 0 0 10px #00ffff; margin: 0; }
        textarea { 
            width: 100%; height: 110px; background: #111; color: #00ffff; border: 2px solid #00ffff; 
            border-radius: 10px; padding: 15px; font-family: 'Courier New', monospace; box-sizing: border-box; resize: none;
        }
        textarea:focus { outline: none; border-color: #DC143C; box-shadow: 0 0 10px #DC143C; }
        button { width: 100%; padding: 15px; background: #DC143C; color: white; font-weight: bold; font-size: 1.1em; border: none; border-radius: 10px; cursor: pointer; text-transform: uppercase; }
        .back-btn { background: #111; border: 2px solid #00ffff; color: #00ffff; }

        /* === Section commentaires style YouTube === */
        #comments-section { width: 100%; max-width: 500px; margin: 0 auto; }
        #comments-header { display: flex; align-items: center; gap: 10px; margin-bottom: 15px; padding-left: 4px; }
        #comments-header h3 { color: #fff; font-size: 1.05em; margin: 0; font-weight: 600; }
        #comments-header span { color: #888; font-size: 0.95em; }

        .comment-item { display: flex; gap: 12px; padding: 14px 4px; border-bottom: 1px solid #1a1a1a; }
        .comment-avatar {
            width: 38px; height: 38px; min-width: 38px; border-radius: 50%;
            background: #111; border: 2px solid #00ffff; color: #00ffff;
            display: flex; align-items: center; justify-content: center;
            font-weight: bold; font-size: 1em; text-shadow: 0 0 6px #00ffff;
        }
        .comment-body { flex: 1; min-width: 0; }
        .comment-meta { display: flex; align-items: center; gap: 8px; margin-bottom: 3px; flex-wrap: wrap; }
        .comment-author { color: #FFD700; font-weight: bold; font-size: 0.9em; }
        .comment-time { color: #666; font-size: 0.78em; }
        .comment-text { color: #eee; font-size: 0.95em; line-height: 1.4; word-break: break-word; margin-bottom: 6px; }
        .comment-actions { display: flex; align-items: center; gap: 18px; }
        .comment-actions button {
            all: unset; display: flex; align-items: center; gap: 5px; cursor: pointer;
            color: #888; font-size: 0.85em; padding: 4px; width: auto;
        }
        .comment-actions button:hover { color: #00ffff; }
        .comment-actions .like-count { color: #aaa; font-size: 0.8em; }
        .comment-empty { color: #666; text-align: center; font-size: 0.9em; padding: 25px 0; }

        #popup-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.75); z-index: 5000; display: none; align-items: center; justify-content: center; }
        #popup-box { background: #0a0a0a; border: 2px solid #00ffff; border-radius: 15px; box-shadow: 0 0 20px #00ffff; padding: 25px; width: 85%; max-width: 340px; text-align: center; }
        #popup-box p { font-size: 1.05em; margin: 0 0 20px 0; word-break: break-word; }
        #popup-box button { background: #DC143C; color: #fff; border: none; padding: 10px 25px; border-radius: 8px; font-weight: bold; cursor: pointer; text-transform: uppercase; }
    </style>
</head>
<body>

    <div id="suggestion-container">
        <h2>Suggestions & Retours</h2>
        <textarea id="msg" placeholder="Votre message..."></textarea>
        <button onclick="sendComment()">Envoyer</button>
        <button class="back-btn" onclick="window.location.href='index.html'">Retour à l'accueil</button>
    </div>

    <div id="comments-section">
        <div id="comments-header">
            <h3>Commentaires</h3>
            <span id="comments-count"></span>
        </div>
        <div id="comments-list">
            <div class="comment-empty">Chargement...</div>
        </div>
    </div>

    <div id="popup-overlay">
      <div id="popup-box">
        <p id="popup-message"></p>
        <button onclick="closePopup()">OK</button>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        // Client Supabase
        const db = supabase.createClient(
          'https://jsuvimxjmjiljntmgbzu.supabase.co',
          'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImpzdXZpbXhqbWppbGpudG1nYnp1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODI0Njk0NTgsImV4cCI6MjA5ODA0NTQ1OH0.F6aDK6oTyp3Tlb9fmkqpzgn4KGAxA5-ClIKlkqzfcR4'
        );

        // Nouvelle fonction de débogage pour voir l'erreur exacte
        async function sendComment() {
            const messageInput = document.getElementById('msg');
            const message = messageInput.value;
            if (!message.trim()) { showPopup("Veuillez écrire un message."); return; }

            try {
                const { data: { user } } = await db.auth.getUser();
                let userName = 'Anonyme';

                if (user) {
                    const { data: profile } = await db.from('profiles').select('username').eq('id', user.id).single();
                    if (profile && profile.username) userName = profile.username;
                }

                // Tentative d'insertion
                const { error: insertError } = await db.from('comments').insert([{ user_name: userName, message: message }]);
                
                // Si Supabase renvoie une erreur, on déclenche le catch manuellement
                if (insertError) throw insertError;

                showPopup('Merci ' + userName + ', votre message a bien été envoyé !');
                messageInput.value = '';
                loadComments();

            } catch (error) {
                console.error("Erreur détaillée:", error);
                // Affiche le message d'erreur précis de Supabase dans le pop-up
                const errorMessage = error.message || error.details || "Une erreur inconnue est survenue.";
                showPopup("Erreur Supabase : " + errorMessage);
            }
        }

        function timeAgo(dateString) {
            if (!dateString) return '';
            const diffMs = Date.now() - new Date(dateString).getTime();
            const min = Math.floor(diffMs / 60000);
            if (min < 1) return "à l'instant";
            if (min < 60) return `il y a ${min} min`;
            const h = Math.floor(min / 60);
            if (h < 24) return `il y a ${h} h`;
            const j = Math.floor(h / 24);
            return `il y a ${j} j`;
        }

        async function loadComments() {
            const list = document.getElementById('comments-list');
            const countEl = document.getElementById('comments-count');

            const { data, error } = await db
                .from('comments')
                .select('user_name, message, created_at')
                .order('created_at', { ascending: false })
                .limit(30);

            if (error || !data || data.length === 0) {
                list.innerHTML = '<div class="comment-empty">Aucun commentaire pour le moment.</div>';
                countEl.textContent = '';
                return;
            }

            countEl.textContent = data.length;

            list.innerHTML = data.map(c => {
                const author = c.user_name || 'Anonyme';
                const initial = author.charAt(0).toUpperCase();
                return `
                <div class="comment-item">
                    <div class="comment-avatar">${initial}</div>
                    <div class="comment-body">
                        <div class="comment-meta">
                            <span class="comment-author">${author}</span>
                            <span class="comment-time">${timeAgo(c.created_at)}</span>
                        </div>
                        <div class="comment-text">${c.message}</div>
                        <div class="comment-actions">
                            <button onclick="showPopup('Fonctionnalité à venir')">👍 <span class="like-count"></span></button>
                            <button onclick="showPopup('Fonctionnalité à venir')">👎</button>
                            <button onclick="showPopup('Fonctionnalité à venir')">Répondre</button>
                        </div>
                    </div>
                </div>`;
            }).join('');
        }

        function showPopup(message) {
          document.getElementById('popup-message').textContent = message;
          document.getElementById('popup-overlay').style.display = 'flex';
        }
        function closePopup() {
          document.getElementById('popup-overlay').style.display = 'none';
        }

        window.onload = loadComments;
    </script>
</body>
</html>
