<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Suggestions - Shadow Market</title>
    <style>
        body { 
            font-family: 'Segoe UI', sans-serif; 
            background: #000; 
            color: #fff; 
            margin: 0; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            min-height: 100vh; 
            padding: 20px; 
            box-sizing: border-box; 
        }

        #suggestion-container { 
            width: 100%; 
            max-width: 500px; 
            background: #0a0a0a; 
            padding: 30px; 
            border: 2px solid #00ffff; 
            border-radius: 15px; 
            box-shadow: 0 0 15px #00ffff; 
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        h2 {
            text-align: center;
            color: #00ffff;
            text-transform: uppercase;
            text-shadow: 0 0 10px #00ffff;
            margin-top: 0;
        }

        textarea { 
            width: 100%; 
            height: 150px; 
            background: #111; 
            color: #00ffff; 
            border: 2px solid #00ffff; 
            border-radius: 10px; 
            padding: 15px;
            font-family: 'Courier New', monospace;
            box-sizing: border-box;
            resize: none;
        }

        textarea:focus {
            outline: none;
            border-color: #DC143C;
            box-shadow: 0 0 10px #DC143C;
        }

        button { 
            width: 100%; 
            padding: 15px; 
            background: #DC143C; 
            color: white;
            font-weight: bold;
            font-size: 1.1em;
            border: none; 
            border-radius: 10px; 
            cursor: pointer; 
            text-transform: uppercase;
        }

        .back-btn {
            background: #111;
            border: 2px solid #00ffff;
            color: #00ffff;
        }

        /* Popup néon (cohérent avec index.html) */
        #popup-overlay {
          position: fixed; top: 0; left: 0; width: 100%; height: 100%;
          background: rgba(0,0,0,0.75); z-index: 5000;
          display: none; align-items: center; justify-content: center;
        }
        #popup-box {
          background: #0a0a0a; border: 2px solid #00ffff; border-radius: 15px;
          box-shadow: 0 0 20px #00ffff; padding: 25px; width: 85%; max-width: 340px;
          text-align: center;
        }
        #popup-box p { font-size: 1.05em; margin: 0 0 20px 0; word-break: break-word; }
        #popup-box button {
          background: #DC143C; color: #fff; border: none; padding: 10px 25px;
          border-radius: 8px; font-weight: bold; cursor: pointer; text-transform: uppercase;
        }
    </style>
</head>
<body>

    <div id="suggestion-container">
        <h2>Suggestions & Retours</h2>
        <textarea id="msg" placeholder="Votre message..."></textarea>
        <button onclick="sendComment()">Envoyer</button>
        <button class="back-btn" onclick="window.location.href='index.html'">Retour à l'accueil</button>
    </div>

    <!-- Modale popup réutilisable -->
    <div id="popup-overlay">
      <div id="popup-box">
        <p id="popup-message"></p>
        <button onclick="closePopup()">OK</button>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        // Client Supabase renommé "db" pour éviter la collision de namespace (bug TDZ)
        const db = supabase.createClient('https://jsuvimxjmjiljntmgbzu.supabase.co', 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImpzdXZpbXhqbWppbGpudG1nYnp1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODI0Njk0NTgsImV4cCI6MjA5ODA0NTQ1OH0.F6aDK6oTyp3Tlb9fmkqpzgn4KGAxA5-ClIKlkqzfcR4');
        
        async function sendComment() {
            const messageInput = document.getElementById('msg');
            const message = messageInput.value;

            if (!message.trim()) {
                showPopup("Veuillez écrire un message.");
                return;
            }

            try {
                // 1. Récupère l'utilisateur connecté
                const { data: { user }, error: userError } = await db.auth.getUser();
                
                let userName = 'Anonyme'; // Par défaut si non connecté

                if (user) {
                    // 2. Cherche son username dans la table profiles
                    const { data: profile } = await db
                        .from('profiles')
                        .select('username')
                        .eq('id', user.id)
                        .single();
                    
                    if (profile && profile.username) {
                        userName = profile.username;
                    }
                }

                // 3. Envoie dans la base de données
                const { error: insertError } = await db
                    .from('comments')
                    .insert([{ user_name: userName, message: message }]);

                if (insertError) throw insertError;

                showPopup('Merci ' + userName + ', votre message a bien été envoyé !');
                messageInput.value = ''; // Vide le champ après envoi

            } catch (error) {
                console.error("Erreur lors de l'envoi:", error);
                showPopup("Une erreur est survenue lors de l'envoi.");
            }
        }

        // Popup néon (identique à index.html pour cohérence UI)
        function showPopup(message) {
          const overlay = document.getElementById('popup-overlay');
          document.getElementById('popup-message').textContent = message;
          overlay.style.display = 'flex';
        }
        function closePopup() {
          document.getElementById('popup-overlay').style.display = 'none';
        }
    </script>
</body>
</html>
