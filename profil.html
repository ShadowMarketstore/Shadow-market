<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mon Profil - Shadow Market</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root { --bg: #0d0e12; --cyan: #00f2fe; --rose: #ff0055; --text: #fff; }
        * { box-sizing: border-box; }
        body { background: var(--bg); color: var(--text); font-family: sans-serif; margin: 0; display: flex; flex-direction: column; align-items: center; overflow-x: hidden; }
        
        .menu-toggle { position: absolute; top: 20px; left: 20px; cursor: pointer; z-index: 1000; }
        .menu-toggle span { display: block; width: 30px; height: 3px; background: var(--cyan); margin: 6px 0; }
        .nav-menu { position: fixed; left: -100%; top: 0; width: 250px; height: 100%; background: #090a0e; transition: 0.3s; padding: 80px 20px; z-index: 999; border-right: 2px solid var(--cyan); }
        .nav-menu.open { left: 0; }
        .nav-menu a { display: block; padding: 15px 0; color: white; text-decoration: none; border-bottom: 1px solid #222; }
        .nav-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 998; }
        .nav-overlay.open { display: block; }

        .wrapper { width: 90%; max-width: 360px; margin-top: 80px; text-align: center; border: 2px solid var(--cyan); padding: 20px; border-radius: 20px; background: rgba(255,255,255,0.02); }
        .user-email-display { font-size: 0.9rem; color: #aaa; margin-bottom: 15px; font-style: italic; word-break: break-all; }
        .points-display { font-size: 3rem; font-weight: bold; color: var(--cyan); margin: 10px 0; }
        
        .select-box, .input-box { width: 100%; padding: 12px; margin: 10px 0; background: #1a1c23; border: 1px solid #333; color: white; border-radius: 5px; box-sizing: border-box; }
        .btn-main { width: 100%; padding: 12px; border: none; border-radius: 5px; font-weight: bold; cursor: pointer; text-transform: uppercase; margin-top: 5px; transition: 0.3s; }
        .btn-main:disabled { opacity: 0.5; cursor: not-allowed; }
        .btn-echanger { background: var(--cyan); color: #000; }
        .btn-fusion { background: var(--rose); color: white; }

        #customModal { display:none; position:fixed; inset:0; background:rgba(0,0,0,0.85); z-index:2000; justify-content:center; align-items:center; }
        .modal-box { background:#1a1c23; border:2px solid var(--cyan); padding:30px; border-radius:20px; text-align:center; width:80%; max-width:300px; }
        #modalMsg { color:#aaa; margin:15px 0; white-space: pre-line; }
    </style>
</head>
<body>

    <div class="menu-toggle" onclick="toggleNav()"><span></span><span></span><span></span></div>
    <div id="navOverlay" class="nav-overlay" onclick="closeNav()"></div>

    <div id="nav" class="nav-menu">
        <a href="index.html">🏠 Accueil</a>
        <a href="profil.html">👤 Profil</a>
        <a href="mes_commandes.html">📦 Mes Commandes</a>
        <a href="points.html">💎 Mes Points</a>
        <a href="bibliotheque.html">📚 Bibliothèque</a>
        <hr style="border: 0; border-top: 1px solid #333; margin: 20px 0;">
        <a href="#" onclick="logoutUser(event)" style="color: var(--rose);">⏻ Déconnexion</a>
    </div>

    <div id="customModal">
        <div class="modal-box">
            <div style="font-size:3rem; margin-bottom:10px;">✅ 🎉</div>
            <h3 id="modalTitle" style="color:white; margin:0;">Succès !</h3>
            <p id="modalMsg"></p>
            <button onclick="closeModal()" style="background:var(--cyan); border:none; padding:10px 20px; border-radius:5px; font-weight:bold; cursor:pointer;">OK</button>
        </div>
    </div>

    <div class="wrapper">
        <h2>ESPACE PERSONNEL</h2>
        <div id="user-email" class="user-email-display">Chargement...</div>
        <div class="points-display" id="pts">0</div>
        
        <div class="boutique-box">
            <label>1. CONVERTIR MES POINTS</label>
            <select id="points-select" class="select-box">
                <option value="2">2 Points</option><option value="5">5 Points</option>
                <option value="10">10 Points</option><option value="20">20 Points</option>
                <option value="50">50 Points</option><option value="100">100 Points</option>
            </select>
            <button id="btn-echanger" class="btn-main btn-echanger" onclick="echanger()">ÉCHANGER</button>
            
            <label style="display:block; margin-top:15px;">2. FUSIONNER UN CODE</label>
            <input type="text" id="code-input" class="input-box" placeholder="Ex: CODE-XXXXXXXX">
            <button id="btn-fusion" class="btn-main btn-fusion" onclick="fusionner()">FUSIONNER</button>
        </div>
    </div>

    <script>
        const db = supabase.createClient("https://jsuvimxjmjiljntmgbzu.supabase.co", "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImpzdXZpbXhqbWppbGpudG1nYnp1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODI0Njk0NTgsImV4cCI6MjA5ODA0NTQ1OH0.F6aDK6oTyp3Tlb9fmkqpzgn4KGAxA5-ClIKlkqzfcR4");

        function showModal(title, msg) {
            document.getElementById('modalTitle').innerText = title;
            document.getElementById('modalMsg').innerText = msg;
            document.getElementById('customModal').style.display = 'flex';
        }
        function closeModal() { document.getElementById('customModal').style.display = 'none'; }

        function toggleNav() { document.getElementById('nav').classList.toggle('open'); document.getElementById('navOverlay').classList.toggle('open'); }
        function closeNav() { document.getElementById('nav').classList.remove('open'); document.getElementById('navOverlay').classList.remove('open'); }

        async function init() {
            const { data: { user } } = await db.auth.getUser();
            if(!user) { window.location.href = "login.html"; return; }
            document.getElementById('user-email').innerText = user.email;
            const { data } = await db.from('profiles').select('loyalty_points').eq('id', user.id).maybeSingle();
            document.getElementById('pts').innerText = data ? data.loyalty_points : 0;
        }

        async function echanger() {
            const btn = document.getElementById('btn-echanger');
            const amount = document.getElementById('points-select').value;
            btn.disabled = true; btn.innerText = "TRAITEMENT...";
            try {
                const { data: codeGenere, error } = await db.rpc('convert_points_en_code', { amount: parseInt(amount) });
                if (error) throw error;
                showModal("Félicitations !", `Code généré : ${codeGenere}\n\nVous pouvez récupérer votre code dans le salon points.`);
                await init();
            } catch (err) { showModal("Erreur", err.message); }
            finally { btn.disabled = false; btn.innerText = "ÉCHANGER"; }
        }

        async function fusionner() {
            const btn = document.getElementById('btn-fusion');
            const code = document.getElementById('code-input').value.trim();
            if(!code) { showModal("Attention", "Veuillez entrer un code"); return; }
            btn.disabled = true; btn.innerText = "FUSION...";
            try {
                const { error } = await db.rpc('fusion_code_secure', { code_input: code });
                if (error) throw error;
                showModal("Succès !", "Fusion réussie !");
                document.getElementById('code-input').value = "";
                await init();
            } catch (err) { showModal("Erreur", err.message); }
            finally { btn.disabled = false; btn.innerText = "FUSIONNER"; }
        }

        async function logoutUser(e) { e.preventDefault(); await db.auth.signOut(); window.location.href = "login.html"; }
        window.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
