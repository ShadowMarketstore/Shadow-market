<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shadow Market</title>
  <style>
    body { font-family: 'Segoe UI', Roboto, sans-serif; background: #000; color: #fff; margin: 0; padding-bottom: 120px; }
    
    /* Header et Logo */
    #header-wrapper { width: 90%; margin: 20px auto; border: 3px solid #00ffff; border-radius: 15px; padding: 5px; box-shadow: 0 0 15px #00ffff; display: flex; justify-content: center; background: #0a0a0a; }
    #main-logo { width: 100%; max-height: 200px; object-fit: contain; }

    /* Barre de recherche et Menu */
    .controls { display: flex; gap: 10px; padding: 0 20px; margin-bottom: 20px; }
    #search-bar { flex-grow: 1; padding: 10px; border-radius: 20px; border: 1px solid #00ffff; background: #111; color: #fff; }
    .hamburger { cursor: pointer; font-size: 24px; color: #00ffff; }

    /* Menu Side */
    #side-menu { position: fixed; top: 0; right: -250px; width: 250px; height: 100%; background: #111; border-left: 2px solid #00ffff; transition: 0.3s; z-index: 2000; padding-top: 60px; }
    .menu-item { padding: 20px; color: #fff; text-decoration: none; display: block; cursor: pointer; border-bottom: 1px solid #333; }
    
    .section-title { text-align: center; color: #00ffff; font-size: 1.6em; margin: 20px 0; text-transform: uppercase; font-weight: bold; }
    
    /* Grille produits */
    .products-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 15px; padding: 10px; }
    .product-card { border: 2px solid #00ffff; border-radius: 15px; padding: 10px; background: #111; display: flex; flex-direction: column; }
    .product-img { width: 100%; height: 150px; background-size: contain; background-position: center; background-repeat: no-repeat; border-radius: 8px; border: 1px solid #DC143C; }
    .buy-btn { background: #DC143C; color: white; border: none; padding: 10px; border-radius: 5px; cursor: pointer; margin-top: 10px; }
    
    .floating-nav { position: fixed; bottom: 20px; left: 5%; right: 5%; background: #111; padding: 15px 25px; border-radius: 40px; border: 1px solid #00ffff; display: flex; justify-content: space-between; align-items: center; z-index: 1000; }
  </style>
</head>
<body>

  <div id="side-menu">
    <div class="menu-item" onclick="filterCategory('Tous')">Tous les produits</div>
    <div class="menu-item" onclick="filterCategory('Free')">Free</div>
    <div class="menu-item" onclick="filterCategory('Premium')">Premium</div>
    <div class="menu-item" onclick="filterCategory('Elite')">Elite</div>
    <div class="menu-item" onclick="closeMenu()">Fermer</div>
  </div>

  <div id="header-wrapper">
    <img id="main-logo" src="" alt="Shadow Market">
  </div>

  <div class="controls">
    <input type="text" id="search-bar" placeholder="Rechercher (ex: Fortnite)..." onkeyup="searchProducts()">
    <div class="hamburger" onclick="document.getElementById('side-menu').style.right = '0'">☰</div>
  </div>

  <h2 class="section-title">Produits</h2>
  <div class="products-grid" id="products-container"></div>

  <nav class="floating-nav">
    <a href="login.html">👤</a>
    <a href="panier.html">🧺</a>
    <a href="index.html">🏠</a>
    <a href="#" onclick="alert('Suggestions bientôt disponible')">💬</a>
  </nav>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const supabaseClient = supabase.createClient('https://jsuvimxjmjiljntmgbzu.supabase.co', 'sb_publishable_Ngm29impwbTLGhuqyCxSJA_E1jXc1DX');
    let allProducts = [];

    async function loadData() {
      const { data } = await supabaseClient.from('products').select('*');
      allProducts = data || [];
      renderProducts(allProducts);
    }

    function renderProducts(list) {
      const container = document.getElementById('products-container');
      container.innerHTML = '';
      list.forEach(p => {
        const card = document.createElement('div');
        card.className = 'product-card';
        card.innerHTML = `
            <div class="product-img" style="background-image: url('${p.image_url}')"></div>
            <h3>${p.name}</h3>
            <span class="current-price">${p.price} €</span>
            <button class="buy-btn" onclick="alert('Ajouté')">AJOUTER</button>
        `;
        container.appendChild(card);
      });
    }

    function searchProducts() {
      const query = document.getElementById('search-bar').value.toLowerCase();
      // On cherche après le "Shadow_"
      const filtered = allProducts.filter(p => p.name.toLowerCase().includes(query));
      renderProducts(filtered);
    }

    function filterCategory(cat) {
      if (cat === 'Tous') renderProducts(allProducts);
      else renderProducts(allProducts.filter(p => p.category === cat));
      closeMenu();
    }

    function closeMenu() { document.getElementById('side-menu').style.right = '-250px'; }
    window.onload = loadData;
  </script>
</body>
</html>
