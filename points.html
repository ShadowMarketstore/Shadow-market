<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mes Points - Shadow Market</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root { --bg: #0d0e12; --cyan: #00f2fe; --rose: #ff0055; --text: #fff; }
        body { background: var(--bg); color: var(--text); font-family: sans-serif; margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; }
        .wrapper { width: 90%; max-width: 400px; }
        h2 { color: var(--cyan); text-align: center; }
        
        .code-card { background: #1a1c23; border: 1px solid #333; padding: 15px; margin: 10px 0; border-radius: 10px; display: flex; justify-content: space-between; align-items: center; }
        .code-info { display: flex; align-items: center; gap: 10px; }
        .code-text { font-family: monospace; font-size: 1.1rem; color: var(--cyan); }
        .copy-btn { background: none; border: none; cursor: pointer; padding: 5px; display: flex; align-items: center; }
        .copy-btn svg { width: 20px; height: 20px; fill: #aaa; transition: 0.3s; }
        .copy-btn:active svg { fill: var(--cyan); transform: scale(1.2); }
        
        .discount-tag { background: var(--rose); padding: 3px 8px; border-radius: 5px; font-size: 0.8rem; }
        .back-btn { display: block; text-align: center; margin-top: 20px; color: white; text-decoration: none; border: 1px solid var(--cyan); padding: 10px; border-radius: 5px; }
    </style>
</head>
<body>

    <div class="wrapper">
        <h2>MES CODES GÉNÉRÉS</h2>
        <div id="codes-list">Chargement de vos codes...</div>
        <a href="profil.html" class="back-btn">⬅ Retour au Profil</a>
    </div>

    <script>
        const db = supabase.createClient(
            "https://jsuvimxjmjiljntmgbzu.supabase.co", 
            "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImpzdXZpbXhqbWppbGpudG1nYnp1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODI0Njk0NTgsImV4cCI6MjA5ODA0NTQ1OH0.F6aDK6oTyp3Tlb9fmkqpzgn4KGAxA5-ClIKlkqzfcR4"
        );

        // Fonction pour copier le code
        async function copyCode(code) {
            try {
                await navigator.clipboard.writeText(code);
                alert("Code copié : " + code);
            } catch (err) {
                console.error("Erreur copie : ", err);
            }
        }

        async function chargerCodes() {
            const { data: { user } } = await db.auth.getUser();
            if (!user) return window.location.href = "login.html";

            const { data, error } = await db
                .from('coupons')
                .select('code, discount_percent')
                .eq('user_id', user.id)
                .order('id', { ascending: false });

            const listDiv = document.getElementById('codes-list');
            
            if (error) {
                listDiv.innerHTML = "Erreur lors du chargement.";
                return;
            }

            if (data.length === 0) {
                listDiv.innerHTML = "<p style='text-align:center;'>Aucun code généré pour le moment.</p>";
                return;
            }

            listDiv.innerHTML = data.map(c => `
                <div class="code-card">
                    <div class="code-info">
                        <span class="code-text">${c.code}</span>
                        <button class="copy-btn" onclick="copyCode('${c.code}')" title="Copier">
                            <svg viewBox="0 0 24 24"><path d="M16 1H4c-1.1 0-2 .9-2 2v14h2V3h12V1zm3 4H8c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h11c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm0 16H8V7h11v14z"/></svg>
                        </button>
                    </div>
                    <span class="discount-tag">${c.discount_percent}%</span>
                </div>
            `).join('');
        }

        window.onload = chargerCodes;
    </script>
</body>
</html>
