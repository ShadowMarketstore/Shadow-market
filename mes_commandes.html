<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mes Commandes — Shadow Market</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root { --cyan: #00f3ff; --crimson: #dc143c; --red: #ff0000; --white: #ffffff; --bg: #000; }
        body { background: var(--bg); color: var(--white); font-family: sans-serif; padding: 20px; }
        
        /* Design des cartes */
        .order-card { border: 2px solid var(--cyan); padding: 15px; border-radius: 12px; margin-bottom: 20px; background: #080808; max-width: 450px; margin: auto; }
        .header-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        .product-name { font-size: 18px; font-weight: bold; color: var(--cyan); }
        .price-tag { font-size: 16px; color: var(--white); }

        .btn-pay, .btn-validate, .btn-download { width: 100%; border: none; padding: 12px; color: var(--white); font-weight: bold; cursor: pointer; border-radius: 5px; margin-top: 10px; text-align: center; text-decoration: none; display: block; }
        .btn-pay { background: var(--red); }
        .btn-validate { background: var(--red); }
        .btn-download { background: var(--cyan); color: #000; }
        
        input { width: 100%; padding: 12px; background: #000; border: 1px solid var(--crimson); color: var(--white); border-radius: 8px; box-sizing: border-box; }
        
        /* Pop-up de succès - 1000312758.jpg */
        .popup { position: fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.85); display:flex; align-items:center; justify-content:center; z-index:9999; }
        .popup-content { background:#080808; padding:30px; border-radius:20px; border:2px solid var(--cyan); text-align:center; width: 85%; max-width: 300px; color: #fff; }
        .popup-btn { background: var(--cyan); border:none; padding:10px 20px; border-radius:5px; font-weight:bold; cursor:pointer; margin-top:20px; color:#000; width: 100%; }
    </style>
</head>
<body>

<h2 style="color: var(--cyan); text-align: center;">MES COMMANDES</h2>
<div id="orders-list"></div>

<script>
    const db = supabase.createClient("https://jsuvimxjmjiljntmgbzu.supabase.co", "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImpzdXZpbXhqbWppbGpudG1nYnp1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODI0Njk0NTgsImV4cCI6MjA5ODA0NTQ1OH0.F6aDK6oTyp3Tlb9fmkqpzgn4KGAxA5-ClIKlkqzfcR4");

    async function loadOrders() {
        const { data: { user } } = await db.auth.getUser();
        if (!user) return;

        const { data } = await db.from('pending_orders').select('*').eq('user_id', user.id);
        
        if (!data) return;
        
        const listDiv = document.getElementById('orders-list');
        listDiv.innerHTML = data.map(order => `
            <div class="order-card">
                <div class="header-row">
                    <span class="product-name">${order.product_name}</span>
                    <span class="price-tag">${order.price}€</span>
                </div>
                
                <button class="btn-pay" onclick="localStorage.setItem('cartItem', JSON.stringify({name:'${order.product_name}', price:${order.price}})); window.location.href='panier.html';">PAYER</button>
                
                <input type="text" id="code-${order.id}" placeholder="CODE-XXXXXXXX">
                <button class="btn-validate" onclick="verifyCode('${order.id}')">VALIDER</button>
                
                <a id="dl-${order.id}" class="btn-download" 
                   href="https://jsuvimxjmjiljntmgbzu.supabase.co/storage/v1/object/public/produits/${order.filename}" 
                   download style="display: ${order.is_verified ? 'block' : 'none'};">TÉLÉCHARGER</a>
            </div>
        `).join('');
    }

    async function verifyCode(id) {
        const code = document.getElementById(`code-${id}`).value;
        const { data } = await db.from('codes_points').select('*').eq('code', code).single();

        if (data) {
            await db.from('pending_orders').update({ is_verified: true }).eq('id', id);
            document.getElementById(`dl-${id}`).style.display = 'block';

            // Affichage du pop-up style 1000312758.jpg
            document.body.insertAdjacentHTML('beforeend', `
                <div class="popup">
                    <div class="popup-content">
                        <div style="font-size: 50px;">✅ 🎉</div>
                        <h2 style="margin: 10px 0;">Succès !</h2>
                        <p>Fusion réussie !</p>
                        <button class="popup-btn" onclick="this.parentElement.parentElement.remove()">OK</button>
                    </div>
                </div>`);
        } else {
            alert("Code invalide.");
        }
    }
    window.onload = loadOrders;
</script>
</body>
</html>
