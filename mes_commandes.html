<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mes Commandes — Shadow Market</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root { 
            --bg: #000000; 
            --cyan: #00f3ff; 
            --success-green: #28a745; 
            --white: #ffffff; 
            --gray: #444444; 
        }
        
        body { 
            background: var(--bg); 
            color: var(--white); 
            font-family: sans-serif; 
            margin: 0; 
            min-height: 100vh; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            padding: 20px;
        }

        /* Bouton Retour */
        .back-btn {
            position: absolute;
            top: 20px;
            left: 20px;
            color: var(--cyan);
            text-decoration: none;
            font-size: 18px;
            font-weight: bold;
            border: 1px solid var(--cyan);
            padding: 5px 10px;
            border-radius: 5px;
        }
        
        .container { width: 100%; max-width: 450px; margin-top: 50px; }
        
        .order-card { border: 2px solid var(--cyan); padding: 20px; border-radius: 15px; margin-bottom: 20px; background: #080808; }
        
        /* Nom du produit en Cyan Néon */
        .product-name { font-size: 18px; font-weight: bold; color: var(--cyan); margin-bottom: 15px; text-align: center; }
        
        input { width: 100%; padding: 12px; background: #000; border: 1px solid var(--cyan); color: var(--white); border-radius: 8px; box-sizing: border-box; margin-bottom: 10px; }
        
        /* Bouton Valider en Cyan Néon */
        .btn-validate { width: 100%; padding: 12px; background: var(--cyan); border: none; color: #000; font-weight: bold; cursor: pointer; border-radius: 5px; }
        
        /* Bouton Télécharger : Gris par défaut, Vert ✅ après */
        .btn-download { width: 100%; padding: 12px; background: var(--gray); color: #ccc; border: none; font-weight: bold; cursor: pointer; border-radius: 5px; margin-top: 10px; }
        .btn-download.active { background: var(--success-green); color: white; }
    </style>
</head>
<body>

<a href="profil.html" class="back-btn">← Retour</a>

<div class="container">
    <h2 style="color: var(--cyan); text-align: center;">MES COMMANDES</h2>
    <div id="orders-list"></div>
</div>

<script>
    const db = supabase.createClient("https://jsuvimxjmjiljntmgbzu.supabase.co", "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImpzdXZpbXhqbWppbGpudG1nYnp1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODI0Njk0NTgsImV4cCI6MjA5ODA0NTQ1OH0.F6aDK6oTyp3Tlb9fmkqpzgn4KGAxA5-ClIKlkqzfcR4");

    async function loadOrders() {
        const { data: { user } } = await db.auth.getUser();
        if (!user) return;

        const { data } = await db.from('pending_orders').select('*').eq('user_id', user.id);
        
        const listDiv = document.getElementById('orders-list');
        listDiv.innerHTML = data.map(order => `
            <div class="order-card">
                <div class="product-name">${order.product_name}</div>
                <input type="text" id="code-${order.id}" placeholder="CODE-XXXXXXXX">
                <button class="btn-validate" onclick="verifyCode('${order.id}')">VALIDER</button>
                <button class="btn-download ${order.is_verified ? 'active' : ''}" id="dl-${order.id}" ${order.is_verified ? '' : 'disabled'} onclick="downloadFile('${order.filename}')">TÉLÉCHARGER</button>
            </div>
        `).join('');
    }

    async function verifyCode(id) {
        const code = document.getElementById(`code-${id}`).value;
        const { data } = await db.from('codes_points').select('*').eq('code', code).single();

        if (data) {
            await db.from('pending_orders').update({ is_verified: true }).eq('id', id);
            const btn = document.getElementById(`dl-${id}`);
            btn.classList.add('active');
            btn.disabled = false;
            alert("Succès ! Téléchargement débloqué.");
        } else {
            alert("Code invalide.");
        }
    }

    function downloadFile(filename) {
        const url = `https://jsuvimxjmjiljntmgbzu.supabase.co/storage/v1/object/public/produits/${filename}`;
        const link = document.createElement('a');
        link.href = url;
        link.download = filename;
        link.click();
    }

    window.onload = loadOrders;
</script>
</body>
</html>
