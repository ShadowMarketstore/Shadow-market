<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mes Commandes — Shadow Market</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root { 
            --bg: #000000; 
            --cyan: #00f3ff; 
            --success-green: #28a745; 
            --white: #ffffff; 
            --gray: #444444; 
            --red-pay: #ff2a2a;
        }
        
        body { 
            background: var(--bg); 
            color: var(--white); 
            font-family: sans-serif; 
            margin: 0; 
            min-height: 100vh; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            padding: 20px;
        }

        .back-btn {
            position: absolute;
            top: 20px;
            left: 20px;
            color: var(--cyan);
            text-decoration: none;
            font-size: 18px;
            font-weight: bold;
            border: 1px solid var(--cyan);
            padding: 5px 10px;
            border-radius: 5px;
        }
        
        .container { width: 100%; max-width: 450px; margin-top: 50px; }
        
        .order-card { 
            border: 2px solid var(--cyan); 
            padding: 20px; 
            border-radius: 15px; 
            margin-bottom: 20px; 
            background: #080808;
            display: flex;
            flex-direction: column;
            gap: 12px; 
        }
        
        .product-name { font-size: 18px; font-weight: bold; color: var(--cyan); text-align: center; }
        
        .btn-pay { width: 100%; padding: 12px; background: var(--red-pay); border: none; color: var(--white); font-weight: bold; cursor: pointer; border-radius: 5px; }
        .btn-pay:hover { background: #ff4444; }

        input { width: 100%; padding: 12px; background: #000; border: 1px solid var(--cyan); color: var(--white); border-radius: 8px; box-sizing: border-box; text-align: center; }
        
        .btn-validate { width: 100%; padding: 12px; background: var(--cyan); border: none; color: #000; font-weight: bold; cursor: pointer; border-radius: 5px; }
        
        .btn-download { width: 100%; padding: 12px; background: var(--gray); color: #ccc; border: none; font-weight: bold; cursor: pointer; border-radius: 5px; }
        .btn-download.active { background: var(--success-green); color: white; }
    </style>
</head>
<body>

<a href="profil.html" class="back-btn">← Retour</a>

<div class="container">
    <h2 style="color: var(--cyan); text-align: center;">MES COMMANDES</h2>
    <div id="orders-list"></div>
</div>

<script>
    const db = supabase.createClient("https://jsuvimxjmjiljntmgbzu.supabase.co", "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImpzdXZpbXhqbWppbGpudG1nYnp1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODI0Njk0NTgsImV4cCI6MjA5ODA0NTQ1OH0.F6aDK6oTyp3Tlb9fmkqpzgn4KGAxA5-ClIKlkqzfcR4");

    const LIEN_CHECKOUT = "https://ton-lien-de-paiement.com/checkout"; // À Remplacer

    async function loadOrders() {
        const { data: { user } } = await db.auth.getUser();
        if (!user) {
            document.getElementById('orders-list').innerHTML = "<p style='text-align:center;'>Veuillez vous connecter.</p>";
            return;
        }

        const { data, error } = await db.from('pending_orders').select('*').eq('user_id', user.id);
        
        if (error || !data || data.length === 0) {
            document.getElementById('orders-list').innerHTML = "<p style='text-align:center;'>Aucune commande en cours.</p>";
            return;
        }

        const listDiv = document.getElementById('orders-list');
        listDiv.innerHTML = data.map(order => {
            
            const priceDisplay = order.price ? `(${order.price} €)` : '';

            return `
            <div class="order-card">
                <div class="product-name">${order.product_name}</div>
                
                ${!order.is_verified ? `
                    <button class="btn-pay" onclick="window.open('${LIEN_CHECKOUT}', '_blank')">
                        PAYER ${priceDisplay}
                    </button>
                ` : ''}

                <input type="text" id="code-${order.id}" placeholder="CODE-XXXXXXXX">
                <button class="btn-validate" onclick="verifyCode('${order.id}')">VALIDER</button>
                <button class="btn-download ${order.is_verified ? 'active' : ''}" id="dl-${order.id}" ${order.is_verified ? '' : 'disabled'} onclick="downloadFile('${order.filename}')">TÉLÉCHARGER</button>
            </div>
        `}).join('');
    }

    async function verifyCode(id) {
        const code = document.getElementById(`code-${id}`).value.trim();
        
        if(!code) {
            alert("Veuillez entrer un code.");
            return;
        }

        // ÉTAPE CLÉ : On vérifie la commande spécifique dans pending_orders
        const { data, error } = await db.from('pending_orders').select('code_activation').eq('id', id).single();

        // Si la commande existe et que le code_activation correspond exactement à ce que le client a tapé
        if (data && data.code_activation === code) {
            await db.from('pending_orders').update({ is_verified: true }).eq('id', id);
            
            alert("Succès ! Téléchargement débloqué.");
            window.location.reload(); 
        } else {
            alert("Code invalide ou incorrect pour cette commande.");
        }
    }

    function downloadFile(filename) {
        if(!filename || filename === 'NULL') {
            alert("Le fichier n'est pas encore disponible.");
            return;
        }
        const url = `https://jsuvimxjmjiljntmgbzu.supabase.co/storage/v1/object/public/produits/${filename}`;
        const link = document.createElement('a');
        link.href = url;
        link.download = filename;
        link.click();
    }

    window.onload = loadOrders;
</script>
</body>
</html>
